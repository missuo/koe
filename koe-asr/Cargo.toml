[package]
name = "koe-asr"
description = "Streaming ASR (Automatic Speech Recognition) library with multiple provider backends (Doubao, Qwen, Apple Speech, MLX Whisper, Sherpa-ONNX)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
async-trait.workspace = true
audiopus.workspace = true
base64.workspace = true
hex = "0.4"
sha2 = "0.10"
flate2.workspace = true
futures-util.workspace = true
log.workspace = true
md-5.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rustls = { workspace = true, default-features = false, features = ["ring"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
bytes = "1"
sherpa-onnx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
uuid = { workspace = true, features = ["v4"] }
ndarray = { version = "0.16", optional = true }
rustfft = { version = "6", optional = true }

[features]
default = []
mlx = []
apple-speech = []
sherpa-onnx = ["dep:sherpa-onnx"]
# Offline on-device WeType voice ASR (embed_140m, pure-Rust; needs an embed140m.koepack model dir)
wetype-offline = ["dep:ndarray", "dep:rustfft"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
